# Stand-in for OCM's cli.yml: a reusable build workflow that attests what it builds.
name: build
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: |
          cp payload.txt out.txt
          echo "built from repo=$GITHUB_REPOSITORY ref=$GITHUB_REF sha=$GITHUB_SHA workflow_ref=$GITHUB_WORKFLOW_REF"
          sha256sum out.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out.txt
